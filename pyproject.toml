[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mylittleclaude"
version = "0.2.1"
description = "Single-operator Telegram bot for driving Claude Code instances across one or more servers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "mylittleclaude operator" }]
dependencies = [
    "python-telegram-bot>=21.0,<22.0",
    "aiosqlite>=0.20,<1.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mylittleclaude = "mylittleclaude.__main__:main"
mylittleclaude-setup = "mylittleclaude.installer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/mylittleclaude/installer/tests"]
